services:
  dynamodb:
    ports:
      - "127.0.0.1::8080"

  db-init:
    network_mode: "service:dynamodb"
    environment:
      DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000

  app:
    network_mode: "service:dynamodb"
    ports: !reset []
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
